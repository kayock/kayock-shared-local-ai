name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Governor package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./governor[dev]"
          pip install -r trophy-room/requirements.txt

      - name: Run automated tests
        run: pytest trophy-room/tests/ governor/tests/
