[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kayock-governor"
version = "0.1.0"
description = "Kayock AI Resource Governor — safe local AI telemetry and optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kayock_governor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
