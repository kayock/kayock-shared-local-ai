[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kayock-governor"
version = "0.1.0"
description = "Kayock AI Resource Governor — safe local AI telemetry and optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# pyproject.toml lives inside the governor package directory. Map that
# directory explicitly to the installed package name instead of searching for
# a nonexistent kayock_governor/ subdirectory.
[tool.setuptools]
packages = ["governor"]
package-dir = {governor = "."}

[tool.setuptools.package-data]
governor = ["prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
